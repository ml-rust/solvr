[package]
name = "solvr"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Scientific computing library for Rust, in the role of SciPy: optimization, ODE and PDE solvers, interpolation, statistics, signal processing and spatial algorithms"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/solvr"
homepage = "https://github.com/ml-rust/solvr"
documentation = "https://docs.rs/solvr"
readme = "README.md"
keywords = ["scipy", "optimization", "ode", "interpolation", "statistics"]
categories = ["algorithms", "mathematics", "science"]

[dependencies]
numr = { version = "0.14" }

[dev-dependencies]

[features]
default = ["graph", "pde"]

# Backend features (passed through to numr)
cuda = ["numr/cuda"]
wgpu = ["numr/wgpu"]

# Sparse tensor support (required by graph and pde modules)
sparse = ["numr/sparse"]

# Module features (require sparse support)
graph = ["sparse"]
pde = ["sparse"]

# Precision features
f16 = ["numr/f16"]

[package.metadata.docs.rs]
no-default-features = true
features = ["graph", "pde"]
